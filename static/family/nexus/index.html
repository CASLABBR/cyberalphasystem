<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>NEXUS — Cyber Alpha System</title>
  <link rel="icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/nexus/shell.css">
</head>
<body>
  <div class="bg"></div>
  <div class="os">
    <aside class="os-rail">
      <div class="brand">
        <div class="orb"><span class="orb-core"></span><span class="orb-ring"></span></div>
        <div>
          <p class="brand-kicker">Cyber Alpha</p>
          <h1>NEXUS</h1>
        </div>
      </div>
      <p class="tag">Mesa central. Só entra o que tem código.</p>
      <div class="badge-row">
        <span id="pill-ver" class="pill">…</span>
        <span id="pill-keys" class="pill warn">chaves</span>
      </div>
      <nav id="menu" class="os-menu"></nav>
    </aside>
    <main class="os-stage">
      <header class="os-bar">
        <strong id="mod-title">NEXUS</strong>
        <span id="mod-hint" class="sub"></span>
      </header>
      <section id="stage" class="os-body"></section>
    </main>
  </div>
  <script src="/nexus/shell.js"></script>
</body>
</html>
