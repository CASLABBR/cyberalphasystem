<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07132c">
  <title>ORBI Azure</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#164ba0,#07132c 42%,#030814 75%);color:#edf6ff;font:15px system-ui;min-height:100vh}
    .wrap{max-width:720px;margin:auto;padding:20px 16px 40px}
    a.back{color:#4db3ff;text-decoration:none;font-size:13px}
    .hero{margin-top:16px;padding:22px;border:1px solid #286ec0;border-radius:24px;background:linear-gradient(145deg,#102d5a,#091a38)}
    button{border:0;color:#fff;font-weight:700;cursor:pointer}
    .primary{width:100%;padding:14px;border-radius:14px;margin-top:16px;background:linear-gradient(135deg,#078ad6,#6758e8)}
    .opt{display:block;width:100%;padding:12px;margin:8px 0;text-align:left;border-radius:12px;background:#102a50;border:1px solid #28598a}
    .stat{color:#61c8ff}
    .ok{color:#7ee6b5;font-weight:700;min-height:1.2em}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/">← NEXUS</a>
    <section class="hero">
      <h1>ORBI Azure</h1>
      <p>Banco AZ-900 neste navegador. Sem aba morta.</p>
      <div class="stat">XP <b id="xp">0</b> · pergunta <span id="n">1</span>/<span id="tot"></span></div>
      <h3 id="q"></h3>
      <div id="opts"></div>
      <p class="ok" id="msg"></p>
      <button class="primary" type="button" id="next">Próxima</button>
    </section>
  </main>
  <script>
    const Q = [
      {q:"Qual serviço gerencia identidades no Azure?", a:["Azure Monitor","Microsoft Entra ID","Azure Functions"], i:1},
      {q:"O que é região no Azure?", a:["Um datacenter único","Conjunto de datacenters próximos","Um grupo de recursos"], i:1},
      {q:"Qual modelo é IaaS?", a:["Azure App Service","Azure Virtual Machines","Microsoft 365"], i:1},
      {q:"O que o Azure Resource Manager faz?", a:["Só fatura","Implanta e organiza recursos","Substitui o Entra ID"], i:1},
      {q:"Availability Zone é:", a:["Zona de DNS","Datacenters isolados na mesma região","Um resource group"], i:1},
      {q:"Azure Blob Storage serve principalmente para:", a:["Objetos/arquivos","Filas de CPU","Identidade"], i:0},
      {q:"O portal Azure é:", a:["Só CLI","Interface web de gestão","Um SO de VM"], i:1},
      {q:"Responsabilidade no IaaS do cliente inclui:", a:["Energia do datacenter","Sistema operacional da VM","Prédio físico"], i:1}
    ];
    let i=0, xp=+(localStorage.orbiXp||0);
    document.getElementById("xp").textContent=xp;
    document.getElementById("tot").textContent=Q.length;
    function draw(){
      const item=Q[i%Q.length];
      document.getElementById("n").textContent=(i%Q.length)+1;
      document.getElementById("q").textContent=item.q;
      document.getElementById("msg").textContent="";
      const box=document.getElementById("opts");
      box.innerHTML="";
      item.a.forEach((t,idx)=>{
        const b=document.createElement("button");
        b.className="opt"; b.type="button"; b.textContent=t;
        b.onclick=()=>{
          if(idx===item.i){ xp+=10; localStorage.orbiXp=xp; document.getElementById("xp").textContent=xp; document.getElementById("msg").textContent="Correto. +10 XP"; }
          else document.getElementById("msg").textContent="Não. Resposta: "+item.a[item.i];
        };
        box.appendChild(b);
      });
    }
    document.getElementById("next").onclick=()=>{ i++; draw(); };
    draw();
  </script>
</body>
</html>
